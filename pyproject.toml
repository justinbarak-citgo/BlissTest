[project]
name = "bliss-test"
version = "0.1.0"
description = "This project allows for pulling down Bliss ad-hoc lab queries in a programmatic fashion for automation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
