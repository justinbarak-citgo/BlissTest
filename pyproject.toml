[project]
name = "bliss"
version = "0.2.2"
description = "This project allows for pulling down Bliss ad-hoc lab queries in a programmatic fashion for automation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.optional-dependencies]
# Only needed if BLISS ever returns legacy .xls or an HTML table instead of .xlsx
legacy = ["xlrd", "lxml"]

[project.scripts]
bliss-pull = "bliss.client:main"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bliss"]
